# Equipment Repository behind XAMPP's Apache.
# https-setup.ps1 copies this to C:\xampp\apache\conf\extra\httpd-repo.conf with
# __APP__ replaced by the system's folder. Do not copy it by hand.
#
# Apache answers phones on http (80) and https (443) and forwards everything to the
# system, which start-server.bat then runs on this PC only (127.0.0.1:8000).
# So XAMPP's PHP version does not matter: the system runs on its own PHP 8.3+.

<VirtualHost *:80>
    ServerName repo.local
    ServerAlias *
    # A serial number with "/" (sent as %2F) must reach the system unchanged
    AllowEncodedSlashes NoDecode
    ProxyPreserveHost On
    ProxyTimeout 600
    # XAMPP's own database page keeps working on http://localhost/phpmyadmin
    ProxyPass /phpmyadmin !
    ProxyPass / http://127.0.0.1:8000/ nocanon
    ProxyPassReverse / http://127.0.0.1:8000/
</VirtualHost>

<VirtualHost *:443>
    ServerName repo.local
    ServerAlias *
    SSLEngine on
    SSLCertificateFile "__APP__/storage/https/repo.crt"
    SSLCertificateKeyFile "__APP__/storage/https/repo.key"
    RequestHeader set X-Forwarded-Proto "https"
    AllowEncodedSlashes NoDecode
    ProxyPreserveHost On
    ProxyTimeout 600
    ProxyPass /phpmyadmin !
    ProxyPass / http://127.0.0.1:8000/ nocanon
    ProxyPassReverse / http://127.0.0.1:8000/
</VirtualHost>
