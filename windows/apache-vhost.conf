# Copy to C:\laragon\etc\apache2\sites-enabled\00-repo.conf
# "00-" makes it the default site, so http://<PC-IP> and http://repo both open the system.
<VirtualHost *:80>
    DocumentRoot "C:/laragon/www/repo/public"
    <Directory "C:/laragon/www/repo/public">
        AllowOverride All
        Require all granted
    </Directory>
    # The certificate phones install for https (see https-setup.ps1)
    AddType application/x-x509-ca-cert .crt
</VirtualHost>

# https - phones keep the data and open labels without a connection only on https.
# Starts once windows\https-setup.ps1 has made the certificate, and needs
# Laragon menu > Apache > SSL > Enabled. Until then Apache simply skips it.
<IfModule ssl_module>
<IfFile "C:/laragon/www/repo/storage/https/repo.crt">
<VirtualHost *:443>
    ServerName repo.local
    ServerAlias *
    DocumentRoot "C:/laragon/www/repo/public"
    SSLEngine on
    SSLCertificateFile "C:/laragon/www/repo/storage/https/repo.crt"
    SSLCertificateKeyFile "C:/laragon/www/repo/storage/https/repo.key"
    <Directory "C:/laragon/www/repo/public">
        AllowOverride All
        Require all granted
    </Directory>
    AddType application/x-x509-ca-cert .crt
</VirtualHost>
</IfFile>
</IfModule>
