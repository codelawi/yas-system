# Copy to C:\laragon\etc\apache2\sites-enabled\00-repo.conf
# "00-" makes it the default site, so http://<PC-IP> and http://repo both open the system.
<VirtualHost *:80>
    DocumentRoot "C:/laragon/www/repo/public"
    <Directory "C:/laragon/www/repo/public">
        AllowOverride All
        Require all granted
    </Directory>
</VirtualHost>
